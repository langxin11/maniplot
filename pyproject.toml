[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "maniplot"
version = "0.1.0"
description = "Publication-ready scientific plotting toolkit & AI Agent Skill for Robotic Manipulation (IEEE ICRA/IROS/RA-L/T-RO, CoRL/RSS, and Chinese Master's Thesis)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [
    { name = "Ming" }
]
keywords = [
    "robotics",
    "manipulation",
    "matplotlib",
    "publication",
    "ieee",
    "icra",
    "iros",
    "corl",
    "scientific-visualization",
    "agent-skill"
]
dependencies = [
    "matplotlib>=3.5.0",
    "numpy>=1.20.0",
]

[project.optional-dependencies]
extra = [
    "seaborn>=0.12.0",
    "scipy>=1.8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["maniplot*"]

[tool.setuptools.package-data]
maniplot = ["styles/*.mplstyle"]
